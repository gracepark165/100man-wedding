<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>100만원으로 결혼하기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout concept: 연못 색 배경 위에 오리 커플이 말풍선으로 질문하고, 결과는 오리 장면 카드 아래 탭 세 개(예산·장소·일정). 색은 그림의 주황 부리와 검정 모자에서 가져옴. 예산은 100만원 고정. */
:root{
  --bg:#D6E6EA; --scene:#C6DDE3; --water:#A6C9D2; --surface:#FBFDFD; --surface-2:#E6EFF1;
  --fg:#1B2428; --muted:#526870; --line:#B6CCD3; --bline:#1F2326;
  --ink:#1F2326; --on-ink:#FFFFFF; --shade:rgba(0,0,0,0);
  --accent:#E39A12; --accent-text:#8A5600; --accent-soft:#FCEFD3; --bar-2:#9DBFC8; --drop:#5DAAD0;
  --ok:#25744A; --ok-soft:#DCEFE3; --warn:#8A5F00; --warn-soft:#F7EBC8; --bad:#B3392A; --bad-soft:#F6DCD6;
  --f-display:"Gaegu","Nanum Pen Script","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2227; --scene:#1A383F; --water:#0E2328; --surface:#173038; --surface-2:#1E3C45;
    --fg:#E8F1F2; --muted:#9FB6BC; --line:#2B474F; --bline:#9FBAC1;
    --ink:#F2F6F6; --on-ink:#10252A; --shade:rgba(6,20,28,.38);
    --accent:#F2B43E; --accent-text:#F2B43E; --accent-soft:#3A3114; --bar-2:#4F7D89; --drop:#8CCBE8;
    --ok:#6FCB93; --ok-soft:#1B3427; --warn:#E0B550; --warn-soft:#3A3014; --bad:#F08C78; --bad-soft:#40201A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F2227; --scene:#1A383F; --water:#0E2328; --surface:#173038; --surface-2:#1E3C45;
  --fg:#E8F1F2; --muted:#9FB6BC; --line:#2B474F; --bline:#9FBAC1;
  --ink:#F2F6F6; --on-ink:#10252A; --shade:rgba(6,20,28,.38);
  --accent:#F2B43E; --accent-text:#F2B43E; --accent-soft:#3A3114; --bar-2:#4F7D89; --drop:#8CCBE8;
  --ok:#6FCB93; --ok-soft:#1B3427; --warn:#E0B550; --warn-soft:#3A3014; --bad:#F08C78; --bad-soft:#40201A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.6;
  word-break:keep-all; overflow-wrap:break-word;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.app{max-width:460px;margin:0 auto}
button{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
.screen{animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen,.duckg,.fx,.spk,.rip,.bobber,.swing,.away{animation:none!important}}

.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--accent-text)}
.q{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.25;text-wrap:balance;margin-top:10px}

/* 낚시 장면: 사용자가 그린 연못 그림 위, 갈색 다리에서 오리 커플이 낚시한다 */
.duckg{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.8s ease-in-out infinite}
.duckg.d2{animation-delay:.9s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-1deg)}}
.duckg.m-bad{animation-name:shake;animation-duration:1.1s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.fx{display:none}
.m-warn .drop,.m-bad .drop,.m-bad .drop2{display:block;animation:drip 1.8s ease-in infinite}
.m-ok .spark,.m-ok .spark2{display:block;animation:twinkle 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spk{animation:twinkle 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes drip{0%{transform:translateY(-8px);opacity:0}20%{opacity:1}100%{transform:translateY(28px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.75);opacity:.6}50%{transform:scale(1.1);opacity:1}}
.rip{fill:none;stroke:#fff;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:rip 2.4s ease-out infinite}
.rip.r2{animation-delay:1.2s}
@keyframes rip{0%{transform:scale(.5);opacity:.95}100%{transform:scale(1.8);opacity:0}}
.bobber{animation:floatb 2.6s ease-in-out infinite}
.bobber.dip{animation:dip 1.1s ease-in-out infinite}
@keyframes floatb{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes dip{0%,100%{transform:translateY(0)}40%{transform:translateY(16px)}}
.swing{animation:swing 1.3s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.away{animation:away 3.2s ease-in infinite}
@keyframes away{0%{transform:translateX(0);opacity:.9}100%{transform:translateX(70px);opacity:0}}
.pond{display:block;line-height:0;border-radius:18px;overflow:hidden;border:1.5px solid var(--bline)}
.pond svg{display:block;width:100%;height:auto}
.pond .rod{fill:none;stroke:#7A4B22;stroke-width:5;stroke-linecap:round}
.pond .ln{fill:none;stroke:#3E4B55;stroke-width:2.4;stroke-linecap:round;opacity:.85}

.bubble{position:relative;min-width:0;background:var(--surface);border:2px solid var(--bline);border-radius:22px 26px 24px 20px;padding:12px 16px;font-family:var(--f-display);font-size:22px;line-height:1.35;font-weight:700;color:var(--fg)}
.bubble::after{content:"";position:absolute;width:14px;height:14px;background:var(--surface);border:0 solid var(--bline);transform:rotate(45deg)}
.bubble.b-left::after{left:-9px;top:26px;border-width:0 0 2px 2px}
.bubble.b-down{margin-bottom:14px}
.bubble.b-down::after{bottom:-9px;left:var(--tail,25%);border-width:0 2px 2px 0}
.bubble .q{margin:0;font-size:27px;line-height:1.3}
.ack{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted);margin-bottom:2px}
.say{display:flex;align-items:center;gap:14px}
.say .bubble{flex:1}
.say.sm{margin-top:10px}
.say.sm .bubble{font-size:18px;font-weight:400}
.say.sm .pond{width:44%;flex:none;border-radius:12px}
.lead,.hint{color:var(--muted);margin-top:12px}
.fine{font-size:12.5px;color:var(--muted);margin-top:14px}

.intro{padding-top:4px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.rules div{padding:12px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center}
.rules b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.rules span{font-size:12.5px;color:var(--muted)}
.feat{margin-top:22px;border-top:1px solid var(--line)}
.feat li{display:flex;flex-direction:column;gap:2px;padding:14px 0;border-bottom:1px solid var(--line)}
.feat b{font-weight:600}
.feat span{color:var(--muted);font-size:14px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.btn{min-height:52px;padding:12px 18px;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:var(--on-ink);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:hover{filter:brightness(1.18)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn.sm{min-height:44px;padding:8px 14px;font-size:14px}

.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.back{min-height:44px;padding:0 12px 0 0;border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px}
.back:hover{color:var(--fg)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:26px}
.prog i{height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:62px;padding:12px 16px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ink)}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.ot{display:flex;flex-direction:column;min-width:0}
.ot b{font-weight:600;font-size:16px}
.ot small{color:var(--muted);font-size:13px}
.chev{color:var(--muted);font-size:20px;line-height:1}

.load{padding-top:40px}

.hero{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.hero .pond{border-radius:0;border:0}
.hsay{background:var(--scene);padding:16px 16px 22px}
.hsay .bubble{margin-bottom:0}
.hero .bubble{font-size:21px}
.hdata{padding:18px 20px 20px}
.h-eyebrow{font-size:13px;color:var(--muted)}
.h-days{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.h-days .num{font-size:52px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.h-days .unit{font-size:20px}
.h-days .sub{margin-left:8px;font-size:14px;color:var(--muted)}
.h-date{font-size:14px;color:var(--muted);margin-top:2px}
.h-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.h-grid dt{font-size:12px;color:var(--muted)}
.h-grid dd{font-weight:600;font-variant-numeric:tabular-nums}
.h-grid div{min-width:0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:14px;padding:6px;background:var(--surface-2);border-radius:12px}
.tabs button{min-height:44px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.panel{margin-top:20px}
.sec{font-family:var(--f-display);font-size:19px;margin:26px 0 10px}
.panel>.sec:first-child{margin-top:0}

.status{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--ok-soft)}
.status.warn{background:var(--warn-soft)}
.status.bad{background:var(--bad-soft)}
.pill{flex:none;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;color:var(--ok);border:1px solid currentColor;white-space:nowrap}
.status.warn .pill{color:var(--warn)}
.status.bad .pill{color:var(--bad)}
.status p{font-size:14.5px}

.use{margin-top:16px}
.use .pgrow b{color:var(--fg)}
.rows li{padding:12px 0;border-bottom:1px solid var(--line)}
.rl{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rn{display:flex;flex-direction:column;min-width:0}
.rn small{color:var(--muted);font-size:12.5px}
.ra{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--bar-2);min-width:2px}
.bar.main i{background:var(--accent)}
.bar.zero i{display:none}
.total{display:flex;justify-content:space-between;padding:14px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.tips{display:flex;flex-direction:column;gap:8px}
.tips li{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:14.5px;display:flex;justify-content:space-between;gap:12px}
.tips li b{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--accent-text)}

.vcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.vtag{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.vtag.pick{background:var(--accent-soft);color:var(--accent-text)}
.vcard h3{font-family:var(--f-display);font-size:20px;margin-top:8px}
.vdesc{color:var(--muted);font-size:14px;margin-top:2px}
.vcost{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.vcost b{font-variant-numeric:tabular-nums}
.vmeta{margin-top:10px;font-size:14px;display:grid;gap:6px}
.vmeta dt{font-size:12px;font-weight:600;color:var(--muted)}
.vcard .btn{margin-top:14px;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none}
.notice{margin-top:12px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;display:grid;gap:8px}
.notice b{font-weight:600}
.src{font-size:12.5px;color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px;margin-top:10px}
summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details ul{padding-bottom:12px;display:grid;gap:10px;font-size:14px}
details li span{display:block;color:var(--muted);font-size:13px}

.pgrow{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pgbar{height:6px;border-radius:3px;background:var(--surface-2);margin:6px 0 4px;overflow:hidden}
.pgbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.pgbar i.over{background:var(--bad)}
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.task input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--accent)}
.task .t{font-weight:600}
.task .d{font-size:13.5px;color:var(--muted)}
.task .w{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--accent-text);font-variant-numeric:tabular-nums}
.task.now .w{color:var(--bad)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task.done .w{color:var(--muted)}
.alert{padding:12px 14px;border-radius:12px;background:var(--warn-soft);font-size:14px;margin-bottom:6px}
.draft{width:100%;min-height:300px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--fg);font:13.5px/1.65 var(--f-body);resize:vertical}
.foot{display:flex;flex-direction:column;gap:10px;margin-top:32px}
</style>
</head>
<body>
<div class="app"><div id="screen" class="screen"></div></div>

<script>
(function(){
'use strict';

var BUDGET=100; /* 만원 */

var DATES=[
 {v:'y2026',label:'올해 안 (11~12월)',sub:'약 2개월 뒤 · 일정이 많이 촉박해요',date:[2026,12,19],peak:false},
 {v:'q1',label:'2027년 1~2월',sub:'약 4개월 뒤 · 비수기',date:[2027,2,13],peak:false},

 {v:'summer',label:'2027년 여름 (6~8월)',sub:'비수기 · 예약 여유가 있는 편이에요',date:[2027,7,10],peak:false},
 {v:'fall',label:'2027년 가을 (9~11월)',sub:'성수기 · 인기 시설은 예약이 일찍 차요',date:[2027,10,16],peak:true},

];

 {v:'bs',label:'부산·경남',subs:[

 {v:'dj',label:'대전·충청',subs:[

  {v:'sj',label:'세종·청주',sub:'신도시와 청주권',f:0.85,kw:'세종 청주'},
  {v:'ca',label:'천안·아산',sub:'수도권 접근이 좋아요',f:0.85,kw:'천안 아산'}]},
 {v:'gj',label:'광주·전라',subs:[
  {v:'gj',label:'광주',sub:'호남권 중심',f:0.85,kw:'광주'},
  {v:'jj',label:'전주',sub:'합리적이에요',f:0.8,kw:'전주'},
  {v:'ys',label:'여수·순천',sub:'합리적이에요',f:0.8,kw:'여수 순천'}]},

  var s='<g transform="translate('+x+' '+y+')" fill="#fff" stroke="#5DAAD0" stroke-width="1.2">';

}
/* state: idle(낚시 중) | catch(잡았다) | bite(입질) | wait(아직 안 물어요) | miss(놓쳤다) */
function fishScene(st,cls){
  st=st||'idle';
  var capMood=st==='wait'?'warn':(st==='miss'?'bad':(st==='catch'?'ok':''));
  var whiteMood=st==='miss'?'bad':(st==='catch'?'ok':'');
  var o='<image href="'+PAINT+'" x="300" y="300" width="800" height="520"/>'+
   '<rect x="300" y="300" width="800" height="520" fill="var(--shade)"/>'+
   '<ellipse cx="525" cy="590" rx="92" ry="13" fill="#7A4B22" opacity=".28"/><ellipse cx="690" cy="645" rx="92" ry="13" fill="#7A4B22" opacity=".28"/>'+
   duckG('cap',410,376,capMood)+duckG('white',575,431,whiteMood,'d2')+
   rod([589,506],[880,355])+'<path class="ln" d="M880 355Q897 545 905 700"/>'+bobber(905,706,false);
  if(st==='catch'){
    o+='<path class="rod" d="M754 561Q930 470 1000 455"/><path class="ln" d="M1000 455L1004 548"/>'+
     '<g transform="translate(1004 548)"><g class="swing"><g transform="translate(0 87) rotate(-90) scale(1.4)">'+FISH+'</g></g></g>'+
     splash(1004,738)+sparkle(950,560)+sparkle(1062,600,.8)+sparkle(1030,500,1.1);
  }else if(st==='miss'){
    o+=rod([754,561],[1005,420])+'<path class="ln" d="M1005 420Q1010 480 1028 520"/>'+hook(1028,520)+fishG(1020,752,.7,.8,'away');
  }else{
    var bite=st==='bite';
    o+=rod([754,561],[1005,420])+'<path class="ln" d="M1005 420Q1015 600 1020 722"/>'+(bite?fishG(1020,764,.85,.4,''):'')+bobber(1020,728,bite);
  }
  return '<div class="pond'+(cls?' '+cls:'')+'" aria-hidden="true"><svg viewBox="340 330 720 470" focusable="false">'+o+'</svg></div>';
}
var screen=document.getElementById('screen');

function won(m){
  m=Math.round(m);
  if(m<=0)return '0원';
  if(m>=10000){var e=Math.floor(m/10000),r=m%10000;return r?e+'억 '+r.toLocaleString('ko-KR')+'만원':e+'억원'}
  return m.toLocaleString('ko-KR')+'만원';
}
function man1(x){return (Math.round(x*10)/10).toString()+'만원'}
function opts(key,a){
  a=a||state.ans;
  if(key==='date')return DATES;
  if(key==='region')return REGIONS;
  if(key==='sub'){var r=find('region',a.region,a);return r?r.subs:[]}
  if(key==='guests')return GUESTS;
  if(key==='venue')return VENUES;
  return a.venue==='restaurant'?MEALS_REST:MEALS_OTHER;
}
function find(key,v,a){
  var list=opts(key,a||state.ans);
  for(var i=0;i<list.length;i++){if(String(list[i].v)===String(v))return list[i]}
  return null;
}
function ymd(arr){return new Date(arr[0],arr[1]-1,arr[2])}
function fmtShort(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일'}
function fmtFull(d){return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+WD[d.getDay()]+'요일'}
function fm(sub){return 1+(sub.f-1)*0.6}

function calc(a){
  var d=find('date',a.date,a),sub=find('sub',a.sub,a),reg=find('region',a.region,a);
  var g=+a.guests,ven=find('venue',a.venue,a),meal=find('meal',a.meal,a);
  var today=new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  var wd=ymd(d.date),days=Math.round((wd-today)/864e5);
  var per=meal.per*fm(sub),mealTotal=Math.round(per*g);
  var rows=[
   {name:'장소 사용',note:ven.label,amt:ven.rent},
   {name:'식대',note:g+'명 × 1인 '+man1(per),amt:mealTotal,main:true}
  ];
  var decor={public:10,restaurant:5,outdoor:10,chapel:5}[ven.v];
  var decorNote=(ven.v==='restaurant'||ven.v==='chapel')?'기본 장식이 있어 적게 잡았어요':'빈 공간이라 꽃과 소품이 필요해요';
  rows.push({name:'장소 장식 (꽃·소품)',note:decorNote,amt:decor,cut:{label:'조화와 직접 만든 소품으로 꾸미기',save:Math.round(decor/2)}});
  var staffN=g<=10?1:(g<=30?2:3),staffAmt=staffN*5;
  rows.push({name:'안내요원 알바비',note:staffN+'명 × 5만원 (4시간 기준)',amt:staffAmt,cut:{label:'가족·지인에게 안내 부탁하기',save:staffAmt}});
  FIXED.forEach(function(f){rows.push({name:f.name,amt:f.amt,cut:f.cut})});
  rows.push({name:'혼인신고 (구청)',note:'수수료 없음',amt:0});
  var total=0;rows.forEach(function(r){total+=r.amt});
  var reserve=BUDGET-total;
  var st,over=total-BUDGET;
  if(over>0)st={lv:'bad',label:'예산 초과',msg:'합계가 '+won(total)+'라 100만원보다 '+won(over)+' 많아요. 아래 방법으로 맞춰 보세요.'};
  else if(reserve<5)st={lv:'warn',label:'빠듯해요',msg:'100만원 안에 들어오지만 예비비가 '+won(reserve)+'뿐이에요. 추가 비용이 생기면 넘칠 수 있어요.'};
  else if(reserve<15)st={lv:'ok',label:'맞출 수 있어요',msg:'합계 '+won(total)+'로 100만원 안에 들어와요. 예비비 '+won(reserve)+'가 남아요.'};
  else st={lv:'ok',label:'여유 있어요',msg:'합계 '+won(total)+'로 100만원 안에 들어와요. 예비비 '+won(reserve)+'가 남아요.'};

  var cuts=[];
  if(over>0){
    var list=[];
    rows.forEach(function(r){if(r.cut&&r.cut.save>0)list.push(r.cut)});
    list.sort(function(x,y){return y.save-x.save});
    var acc=0;
    for(var i=0;i<list.length&&acc<over;i++){cuts.push(list[i]);acc+=list[i].save}
  }
  var tips=[];
  if(g>1)tips.push({t:'하객을 1명 줄이면 식대가 줄어요',v:'-'+won(per)});
  var alt=null;
  opts('meal',a).forEach(function(m){if(m.per<meal.per&&(!alt||m.per<alt.per))alt=m});
  if(alt){var sv=Math.round((meal.per-alt.per)*fm(sub)*g);if(sv>=3)tips.push({t:'식사를 '+alt.label+'(으)로 바꾸면',v:'-'+won(sv)})}
  if(reserve>0&&per>0){var extra=Math.floor(reserve/per);if(extra>=1)tips.push({t:'예비비를 쓰면 하객을 '+extra+'명 더 모실 수 있어요',v:'+'+extra+'명'})}

  return {d:d,sub:sub,reg:reg,g:g,ven:ven,meal:meal,per:per,rows:rows,total:total,reserve:reserve,over:over,st:st,cuts:cuts,tips:tips,
    wd:wd,today:today,days:days,gl:find('guests',a.guests,a).label};
}

function milestones(c){
  return [
   {m:3,lab:'3개월',t:'규모와 100만원 원칙을 양가에 먼저 공유하기',d:'하객 범위와 식사 방식, 직접 해결할 부분을 함께 정해요'},
   {m:2.5,lab:'2개월 반',t:'장소 후보 확인하고 날짜 예약하기',d:c.d.peak?'봄·가을 주말은 인기 시설이 일찍 차요. 신청 시기를 먼저 확인하세요':'신청 일정과 이용 조건을 시설에 직접 확인해요'},

function panelPlan(c){
  var ms=milestones(c);
  var urgent=ms.filter(function(x){return x.m>0&&x.dd<=14}).sort(function(a,b){return b.m-a.m});
  var later=ms.filter(function(x){return !(x.m>0&&x.dd<=14)}).sort(function(a,b){return a.due-b.due||b.m-a.m});
  function item(x){
    var now=x.m>0&&x.dd<=0,cls='task'+(now?' now':'')+(state.checks[x.i]?' done':'');
    var when=x.m===0?'예식일 전후':(now?'지금 바로 시작':(fmtShort(x.due)+'까지'+(x.dd<=14?' ('+x.dd+'일 뒤)':' · 예식 '+x.lab+' 전')));
    return '<li><label class="'+cls+'"><input type="checkbox" data-i="'+x.i+'"'+(state.checks[x.i]?' checked':'')+'><span><span class="t">'+x.t+'</span><br><span class="d">'+x.d+'</span><br><span class="w">'+when+'</span></span></label></li>';
  }
  var done=ms.filter(function(x){return state.checks[x.i]}).length;
  var alert=urgent.length>=4?'<p class="alert">예식까지 시간이 짧아서 앞 단계 '+urgent.length+'가지가 한꺼번에 몰려 있어요. 장소 예약을 가장 먼저 하세요.</p>':'';
  return '<div class="pgrow"><span>준비 진행</span><span id="pgtext">'+done+' / '+ms.length+' 완료</span></div><div class="pgbar"><i id="pgbar" style="width:'+(done/ms.length*100)+'%"></i></div>'+alert+
   (urgent.length?'<h2 class="sec">지금 챙길 일</h2><ul>'+urgent.map(item).join('')+'</ul>':'')+
   (later.length?'<h2 class="sec">앞으로 할 일</h2><ul>'+later.map(item).join('')+'</ul>':'');
}

function verdictScene(c){
  var f,say,tail;
  if(c.over>0){f='miss';tail='30%';say='앗, 놓쳤어요! 합계가 '+won(c.total)+'이라 '+won(c.over)+' 넘었어요. 같이 줄여 봐요!'}
  else if(c.reserve<5){f='wait';tail='30%';say='아직 안 물어요. 예비비가 '+won(c.reserve)+'뿐이라 빠듯해요.'}
  else if(c.reserve<15){f='bite';tail='55%';say='입질이 왔어요! 합계 '+won(c.total)+'이면 100만원 안에 들어와요.'}
  else{f='catch';tail='55%';say='잡았다! 합계 '+won(c.total)+'이면 돼요. 예비비 '+won(c.reserve)+'이 남아요.'}
  return '<div class="hsay"><div class="bubble b-down" style="--tail:'+tail+'"><p>'+say+'</p></div></div>'+fishScene(f);
}
function viewResult(){
  var c=calc(state.ans);
  var months=c.days<30?'1개월 미만':'약 '+Math.round(c.days/30.44)+'개월';
  var tabs=[['budget','예산'],['venue','장소'],['plan','일정']].map(function(t){
    return '<button role="tab" data-a="tab" data-tab="'+t[0]+'" aria-selected="'+(state.tab===t[0])+'">'+t[1]+'</button>';
  }).join('');
  function pn(id,html){return '<div class="panel" role="tabpanel" data-panel="'+id+'"'+(state.tab===id?'':' hidden')+'>'+html+'</div>'}
  return '<section>'+
   '<div class="hero">'+verdictScene(c)+'<div class="hdata"><p class="h-eyebrow">예식까지</p>'+
   '<p class="h-days"><span class="num">'+c.days+'</span><span class="unit">일</span><span class="sub">'+months+'</span></p>'+
   '<p class="h-date">'+fmtFull(c.wd)+' 기준'+(c.d.tbd?' (임시 날짜)':'')+'</p>'+
   '<dl class="h-grid"><div><dt>총 예산</dt><dd>100만원 (식대 포함)</dd></div><div><dt>하객</dt><dd>'+c.gl+'</dd></div>'+
   '<div><dt>지역</dt><dd>'+c.reg.label+' '+c.sub.label+'</dd></div><div><dt>장소 · 식사</dt><dd>'+c.ven.label+' · '+c.meal.label+'</dd></div></dl></div></div>'+
   '<div class="tabs" role="tablist">'+tabs+'</div>'+
   pn('budget',panelBudget(c))+pn('venue',panelVenue(c))+pn('plan',panelPlan(c))+
   '<p class="fine">금액은 프로토타입용 예시 단가로 계산한 추정치예요. 실제 비용과 다를 수 있어요.</p>'+
   '<div class="foot"><button class="btn" data-a="edit">조건 바꾸기</button><button class="btn ghost" data-a="reset">처음부터 다시</button></div>'+
  '</section>';
}

function render(){
  var html=state.view==='intro'?viewIntro():state.view==='q'?viewQuestion():state.view==='load'?viewLoad():viewResult();
  screen.className='screen';
  screen.innerHTML=html;
  void screen.offsetWidth;
  window.scrollTo(0,0);
  var h=screen.querySelector('[tabindex="-1"]');
  if(h)h.focus({preventScroll:true});
}

function finish(){
  state.view='load';state.tab='budget';state.checks={};render();
  setTimeout(function(){state.view='result';state.lock=false;render()},800);
}
function setTab(t){
  state.tab=t;
  var bs=screen.querySelectorAll('.tabs button'),ps=screen.querySelectorAll('.panel');
  for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-selected',bs[i].getAttribute('data-tab')===t?'true':'false');
  for(var j=0;j<ps.length;j++)ps[j].hidden=ps[j].getAttribute('data-panel')!==t;
  var tb=screen.querySelector('.tabs');
  if(tb){var top=tb.getBoundingClientRect().top;if(top<0)window.scrollBy(0,top-8)}
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');
  if(!t)return;
  var a=t.getAttribute('data-a');
  if(a==='start'){state.view='q';state.step=0;state.ack='';render()}
  else if(a==='demo'){state.ans=JSON.parse(JSON.stringify(DEMO));finish()}
  else if(a==='back'){state.ack='';if(state.step===0){state.view='intro'}else{state.step--}render()}
  else if(a==='pick'){
    if(state.lock)return;
    state.lock=true;
    var key=STEP_KEYS[state.step],v=t.getAttribute('data-v');
    if(key==='region'&&String(state.ans.region)!==v)delete state.ans.sub;
    state.ans[key]=v;
    var picked=find(key,v);state.ack=picked?picked.label:'';
    if(key==='venue'&&state.ans.meal&&!find('meal',state.ans.meal))delete state.ans.meal;
    var sibs=screen.querySelectorAll('.opt');
    for(var i=0;i<sibs.length;i++)sibs[i].classList.remove('sel');
    t.classList.add('sel');
    setTimeout(function(){
      if(state.step>=STEP_KEYS.length-1){finish()}
      else{state.step++;state.lock=false;render()}
    },220);
  }
  else if(a==='copy'){
    var ta=document.getElementById('consult'),msg=document.getElementById('copymsg');
    var fb=function(){if(ta){ta.focus();ta.select()}if(msg)msg.textContent='선택했어요. 길게 눌러 복사하세요.'};
    try{navigator.clipboard.writeText(ta.value).then(function(){if(msg)msg.textContent='복사했어요.'},fb)}catch(err){fb()}
  }
  else if(a==='tab')setTab(t.getAttribute('data-tab'));
  else if(a==='edit'){state.view='q';state.step=0;state.lock=false;state.ack='';render()}
  else if(a==='reset'){state.ans={};state.view='intro';state.step=0;state.lock=false;state.ack='';render()}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(!el.matches||!el.matches('.task input'))return;
  state.checks[el.getAttribute('data-i')]=el.checked;
  var row=el.closest('.task');
  if(row)row.classList.toggle('done',el.checked);
  var all=screen.querySelectorAll('.task input'),n=0;
  for(var i=0;i<all.length;i++)if(all[i].checked)n++;
  var tx=document.getElementById('pgtext'),bar=document.getElementById('pgbar');
  if(tx)tx.textContent=n+' / '+all.length+' 완료';
  if(bar)bar.style.width=(n/all.length*100)+'%';
});

render();
})();
</script>
</body>
</html>
